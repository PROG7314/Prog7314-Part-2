name: Aegis Android CI Build & Test

on:
  push:
    branches: [ "main", "develop", "feature/**", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm install
          npm test
